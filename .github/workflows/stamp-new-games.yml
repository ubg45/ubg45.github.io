name: Stamp new games
# When index.html changes on main, record today's date for any game that just appeared so the site
# can tag it "New" automatically (see tools/stamp-added.py).
on:
  push:
    branches: [main]
    paths: [index.html, ubg45.css, ubg45.js, ubg45-config.js, ubg45-news.js, ubg45-stats.js, ubg45-social.js, ubg45-info.js, ubg45-gametab.js, ubg45-fx.js, ubg45-health.js, ubg45-settings.js]
permissions:
  contents: write
jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/stamp-added.py
      - name: Commit
        run: |
          if [ -n "$(git status --porcelain ubg45-added.js index.html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ubg45-added.js index.html
            git commit -m "Stamp new games + refresh asset versions [skip ci]"
            git push
          fi
